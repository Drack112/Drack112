name: Generate Luckyuro ASCII

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/luckyuro.png"
      - ".github/workflows/luckyuro-ascii.yml"
      - "scripts/update-readme.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert Luckyuro image to ASCII
        uses: Vinniai/agent-ascii@v1
        with:
          paths: assets/luckyuro.png
          flags: --width 72 --complex --grayscale
          output-dir: .agent-ascii-out

      - name: Update README
        run: python3 scripts/update-readme.py

      - name: Commit README changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Luckyuro ASCII art"
          file_pattern: README.md
