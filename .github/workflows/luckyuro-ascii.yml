name: Generate Luckyuro ASCII

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/luckyuro.png"
      - ".github/workflows/luckyuro-ascii.yml"
      - "scripts/update-readme.py"
      - "scripts/image-to-ascii.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert Luckyuro image to Braille art
        run: |
          pip install pillow numpy
          python3 scripts/image-to-ascii.py assets/luckyuro.png .agent-ascii-out/luckyuro.txt --width 72

      - name: Update README
        run: python3 scripts/update-readme.py

      - name: Commit README changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Luckyuro ASCII art"
          file_pattern: README.md
