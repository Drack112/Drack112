name: Generate Luckyuro ASCII

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/luckyuro.png"
      - ".github/workflows/luckyuro-ascii.yml"
      - "scripts/update-readme.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert Luckyuro image to ASCII
        id: ascii
        uses: Vinniai/agent-ascii@main
        with:
          paths: assets/luckyuro.png
          source: npm
          save-txt: true
          save-img: false
          output-dir: .agent-ascii-out
          flags: --width 72 --complex --save-txt-history=false
          fail-on-error: true

      - name: Verify generated ASCII
        env:
          RENDERED_COUNT: ${{ steps.ascii.outputs.rendered_count }}
        run: |
          set -euo pipefail

          echo "Rendered: $RENDERED_COUNT"
          find .agent-ascii-out -type f -print

          if [ "${RENDERED_COUNT:-0}" -lt 1 ]; then
            echo "::error::No image was rendered"
            exit 1
          fi

          if ! find .agent-ascii-out -type f -name "*.txt" | grep -q .; then
            echo "::error::No ASCII text file was generated"
            exit 1
          fi

      - name: Update README
        run: python3 scripts/update-readme.py

      - name: Commit README changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Luckyuro ASCII art"
          file_pattern: README.md
